name: continuous deployment API Biblioteca

on:
  push:
    branches: [ "main" ]
  

jobs:

  build:

    runs-on: ubuntu-latest 

    steps:
    - name: Create SQL Server Container
      run: |
        docker run -d --name sqlserver_test \
          -e "ACCEPT_EULA=Y" \
          -e "MSSQL_SA_PASSWORD=@Admin123" \
          -p 1433:1433 \
          mcr.microsoft.com/mssql/server:2025-CU6-ubuntu-22.04
        timeout 90s bash -c "until docker exec sqlserver_test /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '@Admin123' -Q 'SELECT 1' -C; do sleep 5; done"

    - name: Create SQL Server Database
      run: docker exec sqlserver_test /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '@Admin123' -Q "IF DB_ID('ProjetoBiblioteca') IS NULL CREATE DATABASE [ProjetoBiblioteca]" -C

    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore Dependencies
      run: dotnet restore ProjetoBiblioteca.slnx
      working-directory: ProjetoBiblioteca-BackEnd
  
    - name: Build Asp.Net 10 App
      run: dotnet build ProjetoBiblioteca.slnx --configuration Release --no-restore
      working-directory: ProjetoBiblioteca-BackEnd
  
    - name: Test Asp.NET 10 App
      run: dotnet test ProjetoBiblioteca.slnx --configuration Release --no-build --logger "console;verbosity=detailed"
      working-directory: ProjetoBiblioteca-BackEnd

    - name: Docker Compose Build
      run: docker compose build
      working-directory: ProjetoBiblioteca-BackEnd