services:
  projetobiblioteca:
    image: gustavohigino/projetobiblioteca:latest
    build:
      context: .
      dockerfile: ProjetoBiblioteca/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionMSSQL__ConnectionString=Data Source=host.docker.internal,1433;Initial Catalog=ProjetoBiblioteca;User Id=sa;Password=${Password_Database};TrustServerCertificate=true
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    networks:
      - gustavo-network
    
networks:
  gustavo-network:
    driver: bridge
